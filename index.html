<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2742F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Soru Havuzu</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@500;700;800&family=Caveat:wght@600;700&display=swap">
<style>
html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: telefon/tablet uygulaması — mavi zemin, mürekkep çerçeveli kartlar; çözüm ekranı tam ekran: üst çubuk, kalem çubuğu, yakınlaştırılabilir sayfa, şık çubuğu */
:root{
  --bg:#2742F5; --ink:#0A0F3C; --card:#F7F8FF; --field:#FFFFFF; --line:#D9DDF7; --mute:#555C94;
  --sun:#FFD60A; --pink:#FF4F9A; --pink-soft:#FFE1EE; --mint:#22C58B; --mint-soft:#D6F6E9;
  --on-bg:#F7F8FF; --on-bg-mute:#C9D1FF; --stage:#0B1147; --paper:#FFFFFF; --grid:#E8EBFB;
  --display:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --hand:'Caveat','Comic Sans MS',cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--body);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.bgmol{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bgmol svg{position:absolute;opacity:.15;animation:drift linear infinite}
@keyframes drift{to{transform:translateY(-130vh) rotate(180deg)}}

.app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.screen{animation:in .45s cubic-bezier(.2,.9,.3,1.2) both;display:grid;gap:16px}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}

.btn{font:800 15px var(--body);background:var(--sun);color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:12px 16px;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn.ghost{background:var(--card)} .btn.pink{background:var(--pink);color:#fff} .btn.mint{background:var(--mint)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px;box-shadow:0 3px 0 var(--ink)}
.btn[aria-busy="true"]{opacity:.6;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>.btn{flex:1 1 150px}

.hero{color:var(--on-bg);display:grid;gap:6px}
.eyebrow{font:800 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--on-bg-mute)}
.hero h1{font:800 clamp(40px,11vw,62px)/.95 var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}
.hero h1 span{color:var(--sun);display:inline-block;animation:wob 3s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-3px)}}
.hero p{margin:0;color:var(--on-bg-mute);max-width:46ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--stage);color:var(--on-bg);border:2px solid var(--ink);border-radius:15px;padding:10px 12px}
.stat b{display:block;font:800 26px/1.05 var(--display);font-variant-numeric:tabular-nums}
.stat small{font:700 11px var(--body);color:var(--on-bg-mute);letter-spacing:.04em}
.panel{background:var(--card);border:2px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:16px;display:grid;gap:14px;min-width:0}
.panel h2{font:800 20px var(--display);margin:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px}
.note-local{background:#FFF3B8;border:2px solid var(--ink);border-radius:12px;padding:8px 12px;font-weight:700;font-size:13px}

.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dcard{display:grid;gap:6px;text-align:left;background:var(--field);border:2px solid var(--ink);border-radius:14px;padding:12px;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .12s}
.dcard:active{transform:translateY(3px);box-shadow:none}
.dcard .dt{display:flex;align-items:center;gap:8px;font:800 16px var(--body)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);flex:none}
.dcard small{color:var(--mute);font-weight:700}
.due{display:inline-block;background:var(--pink);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 8px;font:800 11px var(--body)}
.minibar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.minibar i{display:block;height:100%;background:var(--mint)}
.empty{display:grid;gap:8px;justify-items:start}
.empty b{font:800 18px var(--display)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:800 13px var(--body);border:2px solid var(--ink);border-radius:999px;padding:6px 12px;background:var(--field);cursor:pointer;transition:transform .1s,background .15s}
.chip[aria-pressed="true"]{background:var(--sun)}
.chip:active{transform:scale(.95)}
.lab{font:800 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.fld{display:grid;gap:6px}
.inp{width:100%;border:2px solid var(--ink);border-radius:12px;padding:10px 12px;background:var(--field);font-weight:700}
.ansrow{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.ansrow .chip{padding:8px 0;text-align:center;border-radius:12px}

/* ---------- alt sayfa (sheet) ---------- */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(10,15,60,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:620px;max-height:88vh;overflow:auto;background:var(--card);border:2px solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;animation:sup .35s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes sup{from{transform:translateY(100%)}}
.sheet h3{margin:0;font:800 22px var(--display)}
.sheet .prev{max-height:30vh;overflow:auto;border:2px solid var(--line);border-radius:12px;background:#fff}
.sheet .prev img{display:block;width:100%}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--stage);color:var(--on-bg);border:2px solid var(--ink);border-radius:14px;padding:10px 16px;font-weight:800;box-shadow:0 4px 0 var(--ink);animation:tin .3s cubic-bezier(.3,1.5,.5,1) both;max-width:90vw;text-align:center}
@keyframes tin{from{opacity:0;transform:translate(-50%,20px)}}

/* ---------- tam ekran (çöz / kırp) ---------- */
.full{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.fbar{display:flex;align-items:center;gap:10px;padding:10px 14px 8px;color:var(--on-bg)}
.x{width:40px;height:40px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:800 18px var(--body);cursor:pointer;box-shadow:0 3px 0 var(--ink);flex:none;display:grid;place-items:center}
.pbar{flex:1;height:14px;border-radius:999px;background:var(--stage);border:2px solid var(--ink);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--sun);transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.fmeta{font:800 13px var(--body);color:var(--on-bg-mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.streak{background:var(--stage);border:2px solid var(--ink);border-radius:999px;padding:2px 10px;color:var(--sun)}
.streak.pop{animation:pop .5s}@keyframes pop{40%{transform:scale(1.3) rotate(-6deg)}}

.tools{margin:0 14px;display:flex;align-items:center;gap:4px;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:5px;box-shadow:0 3px 0 var(--ink);position:relative;z-index:8;overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tb{flex:none;width:42px;height:42px;border-radius:11px;border:2px solid transparent;background:none;display:grid;place-items:center;cursor:pointer;position:relative;color:var(--ink);transition:background .15s,transform .1s}
.tb:active{transform:scale(.9)}
.tb[aria-pressed="true"]{background:var(--sun);border-color:var(--ink)}
.tb svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb .tcol{position:absolute;left:9px;right:9px;bottom:3px;height:4px;border-radius:2px}
.tsep{flex:1;min-width:6px}
.tpanel{position:absolute;left:14px;right:14px;z-index:9;background:var(--card);border:2px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--ink);padding:14px;display:grid;gap:12px;animation:drop .25s cubic-bezier(.2,.9,.3,1.2) both;max-width:520px}
@keyframes drop{from{opacity:0;transform:translateY(-10px) scale(.97)}}
.sw{display:grid;grid-template-columns:repeat(auto-fill,34px);gap:8px}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);cursor:pointer;transition:transform .12s}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--ink);transform:scale(1.05)}
.sw label{width:34px;height:34px;border-radius:50%;border:2px dashed var(--ink);display:grid;place-items:center;cursor:pointer;font-weight:800;position:relative;overflow:hidden}
.sw label input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sizer{display:flex;align-items:center;gap:12px}
.sizer input{flex:1;accent-color:var(--ink)}
.sizer canvas{width:110px;height:40px;border:2px solid var(--line);border-radius:10px;background:#fff;flex:none}
.seg{display:flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{flex:1;padding:8px;border:0;background:var(--field);font-weight:800;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sun)}
.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700}
.sw2{width:50px;height:28px;border-radius:999px;border:2px solid var(--ink);background:var(--line);position:relative;cursor:pointer;flex:none}
.sw2::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.sw2[aria-checked="true"]{background:var(--sun)}.sw2[aria-checked="true"]::after{transform:translateX(22px)}

.vp{flex:1;position:relative;overflow:hidden;margin:10px 14px 0;border:2px solid var(--ink);border-radius:16px;background:var(--grid);touch-action:none;user-select:none;-webkit-user-select:none}
.page{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--paper)}
.qwrap{display:flex;justify-content:center;padding:22px 16px 10px}
.qcol{display:grid;gap:12px;max-width:100%}
.qopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px 14px;font:700 16px var(--body);color:var(--ink);padding:2px 4px}
.qopts span b{font-family:var(--display);margin-right:4px}
.ab small{display:block;font:700 11px var(--body);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page .qimg{display:block;max-width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.qhtml{max-width:640px;margin:0 auto}
.bx{position:absolute;border:3px solid var(--sun);background:rgba(255,214,10,.10);border-radius:6px;pointer-events:none;transition:border-color .15s}
.bx.sel{border-color:var(--pink);background:rgba(255,79,154,.10)}
.bx b{position:absolute;left:-3px;top:-3px;transform:translateY(-100%);background:var(--sun);color:var(--ink);border:2px solid var(--ink);border-radius:8px 8px 8px 0;font:800 12px var(--body);padding:1px 7px;white-space:nowrap}
.bx.noans b{background:var(--pink);color:#fff}
.bx.sel i{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--pink);border:2px solid var(--ink)}
.bx.sel i:nth-of-type(1){left:-12px;top:-12px}.bx.sel i:nth-of-type(2){right:-12px;top:-12px}.bx.sel i:nth-of-type(3){left:-12px;bottom:-12px}.bx.sel i:nth-of-type(4){right:-12px;bottom:-12px}
.scan{position:absolute;left:0;right:0;height:3px;background:var(--sun);box-shadow:0 0 18px 6px rgba(255,214,10,.55);animation:scan 1.6s ease-in-out infinite alternate;z-index:2;pointer-events:none}
@keyframes scan{from{top:0}to{top:100%}}
.istat{color:var(--on-bg);font-weight:700;font-size:14px;padding:0 14px;min-height:21px}
.fpick{position:fixed;left:-200px;top:0;width:1px;height:1px;opacity:0}
.flagq{display:grid;gap:6px;justify-items:start}
.page canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.page canvas.gh{opacity:.32}
.page canvas.lv.hl{opacity:.4}
.scratch{border-top:2px dashed var(--line);background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);background-size:24px 24px;position:relative}
.scratch span{position:absolute;right:10px;top:6px;font:800 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:#B7BEE6}
.snapfx{position:absolute;pointer-events:none;z-index:4;border:3px solid var(--sun);border-radius:50%;width:40px;height:40px;margin:-20px 0 0 -20px;animation:ring .45s ease-out both}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(1.8);opacity:0}}
.zoomtag{position:absolute;right:10px;bottom:10px;z-index:3;background:var(--stage);color:var(--on-bg);border:2px solid var(--ink);border-radius:10px;padding:2px 8px;font:800 12px var(--body);cursor:pointer}

.qhtml{padding:18px 16px;display:grid;gap:12px;font-size:16px}
.qhtml p{margin:0}.qhtml .ask{font-weight:800}
.qhtml ol{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.qhtml li{display:flex;gap:10px;font-weight:600}.qhtml li b{font:800 14px var(--display);min-width:28px;color:var(--mute)}
.qhtml .fig{border:2px solid var(--line);border-radius:12px;padding:10px;overflow:hidden}
.qhtml .fig svg{display:block;width:100%;height:auto}
.eq{font:800 20px var(--display);text-align:center;padding:10px;background:#FFF3B8;border-radius:10px;border:2px dashed var(--ink)}
table.ft{width:100%;border-collapse:collapse;font-size:13px}
.ft th,.ft td{border:1.5px solid var(--line);padding:6px;text-align:center}.ft th{background:var(--stage);color:var(--on-bg)}
.tree{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tree div{border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.tree h4{margin:0;padding:5px;font:800 13px var(--body);text-align:center}.tree ul{margin:0;padding:6px 8px 8px 22px;font-size:14px;font-weight:600}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.cgrid div{padding:6px 2px;text-align:center;border:1px solid var(--line);font-weight:700;font-size:14px}.cgrid b{display:block;color:var(--pink);font-family:var(--display)}
.opts{display:grid;gap:6px}.opts div{display:flex;gap:10px;font-weight:600}.opts b{font-family:var(--display);min-width:22px}

.abar{padding:10px 14px 12px;display:grid;gap:8px}
.abtns{display:grid;grid-template-columns:repeat(5,1fr) auto;gap:8px}
.ab{height:52px;border-radius:14px;border:2px solid var(--ink);background:var(--card);box-shadow:0 4px 0 var(--ink);font:800 22px var(--display);cursor:pointer;transition:transform .08s,box-shadow .08s,background .2s}
.ab:active{transform:translateY(4px);box-shadow:none}
.ab.skip{font:800 13px var(--body);padding:0 12px;background:var(--stage);color:var(--on-bg)}
.ab.ok{background:var(--mint);animation:okb .5s cubic-bezier(.3,1.6,.5,1)}.ab.bad{background:var(--pink);color:#fff;animation:shake .45s}
@keyframes okb{40%{transform:scale(1.12)}}@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.fb{border:2px solid var(--ink);border-radius:16px;padding:12px 14px;display:grid;gap:8px;animation:sup2 .4s cubic-bezier(.2,.9,.3,1.2) both;max-height:34vh;overflow:auto}
@keyframes sup2{from{opacity:0;transform:translateY(14px)}}
.fb.ok{background:var(--mint-soft)}.fb.bad{background:var(--pink-soft)}.fb.blank{background:var(--card)}
.fb h3{margin:0;font:800 20px var(--display)}.fb p{margin:0;font-weight:600}
.stick{background:#FFF3B8;border:2px solid var(--ink);border-radius:4px 14px 14px 14px;padding:8px 12px;transform:rotate(-1deg);font-weight:700;font-size:14px}
.stick small{display:block;font:800 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}

/* kırpma */
.crop{position:absolute;border:3px solid var(--sun);box-shadow:0 0 0 9999px rgba(10,15,60,.45);pointer-events:none}
.crop i{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--sun);border:2px solid var(--ink)}
.crop i:nth-child(1){left:-12px;top:-12px}.crop i:nth-child(2){right:-12px;top:-12px}.crop i:nth-child(3){left:-12px;bottom:-12px}.crop i:nth-child(4){right:-12px;bottom:-12px}
.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:3;background:var(--stage);color:var(--on-bg);border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font:800 12px var(--body);pointer-events:none;white-space:nowrap}
.cbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px 12px}
.cbar .pg{color:var(--on-bg);font-weight:800;font-variant-numeric:tabular-nums}
.cbar .grow{flex:1}
.loading{position:absolute;inset:0;display:grid;place-items:center;font:800 16px var(--body);color:var(--mute)}

/* sonuç */
.ringwrap{display:grid;place-items:center;color:var(--on-bg);text-align:center;gap:6px;padding-top:10px}
.ring{position:relative;width:180px;height:180px}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center}.ring .c b{font:800 50px/1 var(--display)}.ring .c small{font-weight:800;color:var(--on-bg-mute)}
.ringwrap h2{margin:0;font:800 28px var(--display)}.ringwrap p{margin:0;color:var(--on-bg-mute);font-weight:600}
.bars{display:grid;gap:12px}.bars .r{display:grid;gap:5px}.bars .r>div:first-child{display:flex;justify-content:space-between;font-weight:800;font-size:14px}
.track{height:14px;border-radius:999px;background:var(--line);border:2px solid var(--ink);overflow:hidden}.track i{display:block;height:100%;width:0;transition:width 1s cubic-bezier(.3,1.2,.5,1)}

/* havuz listesi */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.th{background:var(--field);border:2px solid var(--ink);border-radius:14px;overflow:hidden;cursor:pointer;display:grid;text-align:left;padding:0}
.th .im{height:110px;background:#fff;overflow:hidden;border-bottom:2px solid var(--ink)}
.th .im img{width:100%;display:block}
.th .im .bi{padding:10px;font-size:12px;font-weight:600;color:var(--mute)}
.th .mt{padding:8px 10px;display:grid;gap:2px}.th .mt b{font-size:13px}.th .mt small{color:var(--mute);font-weight:700;font-size:12px}

#fx{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}
@media (min-width:700px){.abtns{max-width:620px;margin:0 auto;width:100%}.fb{max-width:620px;margin:0 auto;width:100%}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ---------- yeni: ilerleme, seri, seviye ---------- */
.top3{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.ring2{width:84px;height:84px;position:relative;flex:none}
.ring2 svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring2 .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:var(--on-bg)}
.ring2 .c b{font:800 22px/1 var(--display)}.ring2 .c small{font:800 10px var(--body);color:var(--on-bg-mute)}
.lvl{display:grid;gap:6px;color:var(--on-bg);min-width:0}

const ghMsg=e=>!navigator.onLine?'İnternet bağlantısı yok.':e&&e.status===401?'GitHub anahtarı geçersiz ya da süresi dolmuş. Ayarlardan yeni anahtar gir.':e&&e.status===403?'Anahtarın bu depoya yazma izni yok. Contents: Read and write izni ver.':e&&e.status===404?'Depo bulunamadı. Ayarlardaki depo adını kontrol et.':'GitHub\'a ulaşılamadı ('+(e&&e.message||'hata')+').';

let DUR=LS.get('sh2-durum',{});
const now=()=>Date.now();
const gunK=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function allQ(){return [...SQ,...Object.values(PR.ek||{})].map(q=>{const p=PR.q[q.id]||{};return{...q,...p,id:q.id,ans:p.ans!==undefined?p.ans:q.ans,flag:p.flag!==undefined?p.flag:q.flag}}).filter(q=>!q.sil)}
const isDue=q=>q.seen&&(q.due||0)<=now();
function setP(id,patch){PR.q[id]={...(PR.q[id]||{}),...patch,t:now()};LS.set('sh2-ilerleme',PR);syncSoon()}

function mergeP(r,l){
  const o={...r,q:{...r.q},gun:{...(r.gun||{})}};
  for(const[k,v]of Object.entries(l.q||{}))if(!o.q[k]||(v.t||0)>(o.q[k].t||0))o.q[k]=v;
  for(const[k,v]of Object.entries(l.gun||{})){const a=o.gun[k]||{n:0,d:0};o.gun[k]={n:Math.max(a.n||0,v.n||0),d:Math.max(a.d||0,v.d||0)}}
  o.ek={...(r.ek||{}),...(l.ek||{})};o.xp=Math.max(r.xp||0,l.xp||0);o.rozet=[...new Set([...(r.rozet||[]),...(l.rozet||[])])];
  o.hedef=(l.ht||0)>(r.ht||0)?l.hedef:r.hedef;o.ht=Math.max(l.ht||0,r.ht||0);o.yukleme=Math.max(r.yukleme||0,l.yukleme||0);
  return o}

let syncT=0,syncing=false,dirty=false,prSha=null;
function syncSoon(){dirty=true;clearTimeout(syncT);syncT=setTimeout(pushP,2500)}
async function pushP(){
  if(!CFG.token||syncing){if(syncing)syncSoon();return}syncing=true;
  try{for(let i=0;i<3;i++){
    const m=await GH.meta('ilerleme.json');let remote={v:1,q:{},gun:{},xp:0,rozet:[],hedef:30};
    if(m){try{remote=JSON.parse(b64d(m.content))}catch(e){}}
    const merged=mergeP(remote,PR);
    try{const r=await GH.put('ilerleme.json',b64e(JSON.stringify(merged)),m&&m.sha,'ilerleme');prSha=r.content&&r.content.sha;PR=merged;LS.set('sh2-ilerleme',PR);dirty=false;break}
    catch(e){if(e.status!==409&&e.status!==422)throw e}
  }}catch(e){if(navigator.onLine)console.warn(e);setTimeout(syncSoon,30000)}
  finally{syncing=false}
}
addEventListener('visibilitychange',()=>{if(document.hidden&&dirty)pushP()});

async function pull(quiet){
  if(!CFG.token)return false;
  try{
    const[s,p,d]=await Promise.all([GH.raw('sorular.json'),GH.meta('ilerleme.json'),GH.raw('durum.json')]);
    const old=new Set(SQ.map(q=>q.id));
    if(s){SQ=await s.json();LS.set('sh2-sorular',SQ)}
    if(p){try{const r=JSON.parse(b64d(p.content));PR=mergeP(r,PR);LS.set('sh2-ilerleme',PR)}catch(e){}}
    if(d){DUR=await d.json();LS.set('sh2-durum',DUR)}
    const yeni=SQ.filter(q=>!old.has(q.id)).length;
    if(yeni&&old.size)newArrived(yeni);
    return true
  }catch(e){if(!quiet)toast(ghMsg(e));return false}
}

async function upload(f){
  const isPdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name),isImg=/^image\//.test(f.type);
  if(!isPdf&&!isImg){toast('Sadece PDF ya da fotoğraf yükleyebilirsin.');return}
  if(f.size>45e6){toast('Dosya çok büyük (45 MB üstü). PDF\'i parçalara böl.');return}
  const card=document.createElement('div');card.className='proc';card.innerHTML='<span class="beam"></span><b>Yükleniyor…</b><small>'+esc(f.name)+'</small>';
  const anchor=app.querySelector('.top3');anchor&&anchor.after(card);
  try{
    let b64;
    if(isImg){const bm=await createImageBitmap(f).catch(()=>null);let src=bm;if(!src){src=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=URL.createObjectURL(f)})}const W=src.width,H=src.height,s=Math.min(1,2400/Math.max(W,H)),c=document.createElement('canvas');c.width=W*s|0;c.height=H*s|0;c.getContext('2d').drawImage(src,0,0,c.width,c.height);b64=c.toDataURL('image/jpeg',.88).split(',')[1]}
    else b64=await new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.onerror=j;fr.readAsDataURL(f)});
    const d=new Date(),st=d.getFullYear()+[d.getMonth()+1,d.getDate(),d.getHours(),d.getMinutes(),d.getSeconds()].map(v=>String(v).padStart(2,'0')).join('');
    const ad=(f.name.replace(/\.[^.]+$/,'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w-]+/g,'-').slice(0,40)||'dosya')+(isPdf?'.pdf':'.jpg');
    await GH.put('gelen/'+st+'-'+ad,b64,null,'yükleme: '+ad);
    PR.yukleme=(PR.yukleme||0)+1;LS.set('sh2-ilerleme',PR);syncSoon();
    LS.set('sh2-bekle',now()+15*60e3);DUR={...DUR,calisiyor:true,kota:false,mesaj:'Dosya yüklendi. Zeka birkaç saniye içinde başlayacak.'};
    toast('Yüklendi. Sorular hazır oldukça burada belirecek.');burst(card,40);home();poll(true);checkBadges();
  }catch(e){card.remove();toast(ghMsg(e))}
}

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

      let A=L();if(!A.length){toast('Bu seçimde soru yok.');return}

      if(n)A=A.slice(0,n);pref={n:md==='deneme'?pref.n:n,ord,only};LS.set('sh-pref',pref);close();startTest(A.map(q=>q.id),md);

let T=null;

function qHTML(q){

}

   <div class="fbar"><button class="x" id="qx" aria-label="Testten çık">✕</button><div class="pbar"><i id="pb" style="width:${T.i/T.ids.length*100}%"></i></div><span class="fmeta">${T.i+1}/${T.ids.length}</span>${den?'':`<span class="fmeta streak" id="stk">Seri ${T.streak}</span>`}<span class="fmeta timer" id="clk">0:00</span>${q.ipucu&&q.ipucu.length&&!den?`<button class="x hintbtn" id="hB" aria-label="İpucu al"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0012 3z"/></svg><span class="cnt">${q.ipucu.length}</span></button>`:''}</div>
   ${den?`<div class="optik" id="opt">${T.ids.map((id,i)=>`<button data-i="${i}" class="${T.ans[id]!=null?'dolu':''}${i===T.i?' cur':''}">${i+1}</button>`).join('')}</div>`:''}
   <div class="tools" id="tools">${['pen','ball','pencil','hl','er','hand'].map(k=>`<button class="tb" data-t="${k}" aria-label="${TN[k]}" aria-pressed="${tool===k}">${svg(k)}${TS[k]&&TS[k].c?`<span class="tcol" style="background:${TS[k].c}"></span>`:''}</button>`).join('')}<span class="tsep"></span><button class="tb" id="uB" aria-label="Geri al">${svg('undo')}</button><button class="tb" id="rB" aria-label="Yinele">${svg('redo')}</button><button class="tb" id="mB" aria-label="Diğer ayarlar">${svg('more')}</button></div>
   <div id="tp"></div><div class="hint2" id="hint"></div>
   <div class="vp" id="vp"><div class="page" id="page"></div><span class="hint" id="shapeTag" hidden></span><button class="zoomtag" id="zoomTag" hidden></button></div>
   <div class="abar" id="abar"></div></div>`;
  const vp=$('#vp'),page=$('#page');
  page.innerHTML=qHTML(q)+`<div class="scratch" id="scr"><span>Karalama alanı</span></div>`;
  fillImgs(page);
  T.ink=new Ink(page);
  T.g=new Gest(vp,page,{canDraw:e=>{if(e.pointerType==='pen'&&!penSeen){penSeen=true;LS.set('sh-pen',true);toast('Kalem algılandı: kalemle yaz, parmakla kaydır.')}if(tool==='hand')return false;if(e.pointerType==='touch'&&penSeen&&!OPT.fingerDraw)return false;return true},down:e=>T.ink.down(e),move:e=>T.ink.move(e),up:e=>T.ink.up(e),cancel:()=>T.ink.cancel()});
  const lay=()=>{const vw=vp.clientWidth,vh=vp.clientHeight,yan=OPT.yan!==false&&vw>=860&&vw>vh*1.15;page.classList.toggle('yan',yan);page.style.width=vw+'px';
    const colW=yan?vw*.46:vw,qi=page.querySelector('.qimg');if(qi){const pw=q.pw||Math.min(1,(q.w||900)/1700);qi.style.width=Math.min(colW-32,Math.max(240,pw*Math.max(Math.min(yan?colW*1.5:colW,780),620)))+'px';const qc=qi.parentNode;qc.style.width=qi.style.width}
    const im=page.querySelector('.qwrap');const ch=im?im.offsetHeight:300;$('#scr').style.height=yan?Math.max(vh,ch)+'px':Math.max(vh*.85,ch*.9,360)+'px';T.ink.resize();T.g.fix()};
  const img=page.querySelector('.qimg');if(img)img.addEventListener('load',()=>{if(T&&T.q===q)lay()},{once:true});
  lay();T.lay=lay;
  getInk(q.id).then(g=>{if(T&&T.q===q){T.old=g||[]}});
  bindTools();answerBar();
  $('#qx').onclick=()=>{if(den&&Object.keys(T.ans).length&&!$('#qx').dataset.c){$('#qx').dataset.c=1;toast('Denemeyi bitirmeden çıkmak için tekrar dokun.');return}saveInk();T=null;home()};
  $('#zoomTag').onclick=()=>T.g.reset();

}
addEventListener('resize',()=>{if(view==='solve'&&T&&T.lay)T.lay()});
setInterval(()=>{const c=$('#clk');if(!c||!T)return;if(T.mode==='deneme'){const kal=Math.max(0,T.dur-(now()-T.t0)),s=kal/1000|0;c.textContent=(s/60|0)+':'+String(s%60).padStart(2,'0');c.classList.toggle('az',kal<120e3);if(!kal&&!T.bitti){T.bitti=1;toast('Süre doldu!');finishDeneme()}}else{const s=(now()-T.t0)/1000|0;c.textContent=(s/60|0)+':'+String(s%60).padStart(2,'0')}},500);

function showHint(){const q=T.q,h=$('#hint');if(!q.ipucu||!q.ipucu.length)return;if(T.hint>=q.ipucu.length){h.innerHTML='';T.hint=0;return}const i=T.hint++;h.style.top=($('#tools').getBoundingClientRect().bottom+6)+'px';h.innerHTML=`<div class="stick"><small>İpucu ${i+1}/${q.ipucu.length} · kapatmak için dokun</small>${esc(q.ipucu[i])}</div>`;h.firstChild.onclick=()=>{h.innerHTML=''};const c=$('#hB .cnt');if(c)c.textContent=q.ipucu.length-T.hint;T.usedHint=true}

function answerBar(){

function pickDen(k,b){const id=T.q.id;T.ans[id]=T.ans[id]===k?undefined:k;if(T.ans[id]===undefined)delete T.ans[id];answerBar();const o=full.querySelector(`#opt button[data-i="${T.i}"]`);if(o)o.classList.toggle('dolu',T.ans[id]!=null);if(T.ans[id]!=null&&T.i<T.ids.length-1)setTimeout(()=>{if(T&&T.q.id===id){T.i++;openQ()}},350)}
function pick(k){if(T.done)return;if(T.q.ans==null){askKey(k);return}finish(k)}
function askKey(k){sheet(`<h3>Doğru cevap hangisi?</h3><p style="margin:0;font-weight:600;color:var(--mute)">Bu sorunun cevabı henüz kayıtlı değil. Cevap anahtarındaki şıkkı seç.</p><div class="ansrow">${[...LET].map((l,i)=>`<button class="chip" data-a="${i}">${l}</button>`).join('')}<span></span></div>`,(el,close)=>{el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{close();T.q.ans=+b.dataset.a;setP(T.q.id,{ans:T.q.ans});finish(k)})})}

function record(q,k,ms){
  const blank=k==null,ok=!blank&&k===q.ans;
  let box=(PR.q[q.id]||{}).box||0;box=ok?Math.min(5,Math.max(2,box+1)):1;
  const p=PR.q[q.id]||{};setP(q.id,{box,due:now()+IV[box]*864e5,seen:now(),right:(p.right||0)+(ok?1:0),wrong:(p.wrong||0)+(ok?0:1),last:ok?'ok':'bad'});
  const g=PR.gun[gunK()]||{n:0,d:0};g.n++;if(ok)g.d++;PR.gun[gunK()]=g;LS.set('sh2-ilerleme',PR);
  return{id:q.id,ders:q.ders,konu:q.konu,ok,blank,ms,k,box}
}
function finish(k){
  if(T.done)return;T.done=true;const q=T.q;
  const btns=document.querySelectorAll('.ab[data-k]');const R=record(q,k,now()-T.qs);T.res.push(R);
  if(q.ans!=null&&btns[q.ans])btns[q.ans].classList.add('ok');if(!R.blank&&!R.ok)btns[k].classList.add('bad');
  if(R.ok){T.streak++;T.maxSeri=Math.max(T.maxSeri,T.streak);burst(btns[k]);addXP(10+Math.min(10,(T.streak-1)*2)-(T.usedHint?4:0),btns[k])}else{T.streak=0;addXP(2)}
  const st=$('#stk');if(st){st.textContent='Seri '+T.streak;if(R.ok){st.classList.remove('pop');void st.offsetWidth;st.classList.add('pop')}}
  $('#pb').style.width=((T.i+1)/T.ids.length*100)+'%';

  const aiNote=q.src==='ai'&&(PR.q[q.id]||{}).ans===undefined?`<p style="font-size:13px;font-weight:700;margin:0">Bu sorunun cevabını zeka buldu, yanlış olabilir. <button class="btn ghost sm" id="fixA">Cevabı düzelt</button></p>`:'';
  const nt=q.not||q.note?`<div class="stick"><small>Notun</small>${esc(q.not||q.note)}</div>`:'';
  $('#abar').insertAdjacentHTML('afterbegin',`<div class="fb ${R.blank?'blank':R.ok?'ok':'bad'}"><h3>${R.blank?'Boş bıraktın · cevap '+LET[q.ans]:R.ok?(T.streak>=3?`Doğru! ${T.streak} seri`:'Doğru!'):'Yanlış · cevap '+LET[q.ans]}</h3>${exp}${nt}${aiNote}<div class="watch"><button class="btn sm" id="wA">▶ Anlatımı izle</button><button class="btn ghost sm" id="wB">Benzer soru üret</button></div><p style="font-size:13px;color:var(--mute)">Bu soru ${days} gün sonra tekrar gelecek.</p></div>`);
  $('#wA').onclick=()=>anlat(allQ().find(x=>x.id===q.id)||q);$('#wB').onclick=()=>benzer(q);
  if($('#fixA'))$('#fixA').onclick=()=>sheet(`<h3>Doğru cevap hangisi?</h3><div class="ansrow">${[...LET].map((l,i)=>`<button class="chip" data-a="${i}" aria-pressed="${q.ans===i}">${l}</button>`).join('')}<span></span></div>`,(el,close)=>el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{setP(q.id,{ans:+b.dataset.a});close();toast('Cevap kaydedildi.')}));
  const ab=$('.abtns');ab.innerHTML=`<button class="btn" id="nx" style="grid-column:1/-1">${last?'Sonucu gör':'Sonraki soru'} ▸</button>`;ab.style.gridTemplateColumns='1fr';
  $('#nx').onclick=()=>{if(last)result();else{T.i++;T.usedHint=false;openQ()}};
  checkBadges({cozdu:true,maxSeri:T.maxSeri});
}
function finishDeneme(){
  saveInk();const Q=allQ();T.res=[];
  T.ids.forEach(id=>{const q=Q.find(x=>x.id===id);if(!q)return;const k=T.ans[id];if(q.ans==null)return;T.res.push(record(q,k??null,0))});

function saveInk(){if(T&&T.ink&&T.ink.dirty&&T.ink.strokes.length){T.ink.dirty=false;putInk(T.q.id,T.ink.data())}}

/* ================= sonuç ================= */
function result(den){
  view='result';full.innerHTML='';const R=T.res,n=R.length,d=R.filter(r=>r.ok).length,b=R.filter(r=>r.blank).length,y=n-d-b,net=d-y/4,pct=n?d/n:0;

  const wr=R.filter(r=>!r.ok).map(r=>r.id),mode=T.mode;
  app.innerHTML=`<section class="screen"><div class="ringwrap"><div class="ring"><svg viewBox="0 0 180 180"><circle cx="90" cy="90" r="76" fill="none" stroke="#0B1147" stroke-width="18"/><circle id="arc" cx="90" cy="90" r="76" fill="none" stroke="#FFD60A" stroke-width="18" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.3s cubic-bezier(.3,1,.4,1)"/></svg><div class="c"><b id="cnt">0</b><small>/ ${n} doğru</small></div></div>
  <h2>${pct===1?'Kusursuz':pct>=.75?'Çok iyi gidiyorsun':pct>=.5?'Yarıyı geçtin':'Tekrar zamanı'}</h2><p>${y} yanlış · ${b} boş · ${net.toFixed(2)} net · ${(el/60|0)} dk ${el%60} sn</p></div>
  <div class="panel"><h2>Ders bazlı</h2><div class="bars">${Object.entries(by).map(([k,v])=>`<div class="r"><div><span>${esc(k)}</span><span>${v.d}/${v.n}</span></div><div class="track"><i data-w="${v.d/v.n*100}" style="background:${DC[k]||'#C9CEF0'}"></i></div></div>`).join('')}</div>
  ${den?`<h2>Cevapların</h2><div class="rev">${R.map((r,i)=>{const q=allQ().find(x=>x.id===r.id)||{};return `<button class="ri" data-id="${r.id}"><b>${i+1}</b><span style="text-align:left;font-weight:700">${esc(q.konu||q.ders||'')}<br><small style="color:var(--mute)">Senin: ${r.k!=null?LET[r.k]:'boş'} · Doğru: ${q.ans!=null?LET[q.ans]:'?'}</small></span><span class="st" style="background:${r.ok?'var(--mint)':r.blank?'var(--line)':'var(--pink)'}">${r.ok?'D':r.blank?'B':'Y'}</span></button>`}).join('')}</div>`:''}
  <div class="row">${wr.length?`<button class="btn pink" id="rw">Yanlışları tekrar çöz</button>`:''}<button class="btn ghost" id="hm">Ana ekran</button></div></div></section>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{$('#arc').style.strokeDashoffset=C*(1-pct);app.querySelectorAll('.track i').forEach(i=>i.style.width=i.dataset.w+'%')}));
  let v=0;const tick=()=>{if(v<d){v++;const c=$('#cnt');if(c)c.textContent=v;setTimeout(tick,90)}};setTimeout(tick,200);
  if(pct>=.75)setTimeout(()=>burst(null,150),400);
  app.querySelectorAll('.ri').forEach(b=>b.onclick=()=>reviewOne(b.dataset.id));
  if($('#rw'))$('#rw').onclick=()=>startTest(wr);$('#hm').onclick=()=>{T=null;home()};scrollTo(0,0);

  }

}

  else if(c.t==='daire'&&p.length>=2){const r=(c.r||30)*1.3;e=document.createElementNS(NS,'circle');e.setAttribute('cx',p[0]);e.setAttribute('cy',ycPl(p[1]));e.setAttribute('r',r);e.setAttribute('fill','none');e.setAttribute('stroke',col==='#FFD60A'?'#E5243B':col);e.setAttribute('stroke-width',6);anim(e,2*Math.PI*r)}
  else if(c.t==='etiket'&&p.length>=2){e=document.createElementNS(NS,'text');e.setAttribute('x',p[0]);e.setAttribute('y',ycPl(p[1]));e.setAttribute('fill','#E5243B');e.setAttribute('font-size',48);e.setAttribute('font-family','Caveat, cursive');e.setAttribute('font-weight',700);e.textContent=c.s||'';e.style.opacity=0;e.style.transition='opacity .4s';svg.appendChild(e);setTimeout(()=>e.style.opacity=1,dur*.5)}
}
function writePl(s,dur,my){const ln=document.createElement('span');ln.className='ln';[...s].forEach(ch=>{const sp=document.createElement('span');sp.textContent=ch;ln.appendChild(sp)});$('#plb',PL.el).appendChild(ln);const L=ln.children;[...L].forEach((c,k)=>setTimeout(()=>{if(PL&&my===PL.token)c.classList.add('on')},k*dur/L.length))}
function stepPl(n,instant){
  const a=PL.A[n],my=PL.token,dur=instant?0:900/PL.rate,col=RENK[n%RENK.length],el=PL.el;
  $('#plst',el).textContent=`${n+1}/${PL.A.length}`;$('#plcap',el).textContent=a.soz;
  (a.ciz||[]).forEach((c,k)=>setTimeout(()=>{if(PL&&my===PL.token)drawPl(c,dur,col)},instant?0:k*350/PL.rate));
  (a.yaz||[]).forEach((s,k)=>{const cev=/^cevap\s*:/i.test(s);setTimeout(()=>{if(!PL||my!==PL.token)return;if(cev){const b=document.createElement('span');b.className='ans';b.textContent=s;$('#plb',el).appendChild(b);if(!instant)burst(b,40)}else writePl(s,instant?0:Math.min(1400,s.length*70)/PL.rate,my)},instant?0:(400+k*1100)/PL.rate)});
  if(instant)return Promise.resolve();
  const bar=$('#plpg',el).children[n].firstChild;bar.style.transition='none';bar.style.width='0';
  const est=Math.max(2500,a.soz.length*62)/PL.rate;requestAnimationFrame(()=>{bar.style.transition=`width ${est}ms linear`;bar.style.width='100%'});
  return new Promise(res=>{let done=false;const fin=()=>{if(!done){done=true;bar.style.transition='none';bar.style.width='100%';res()}};
    say(a.soz,PL.rate).then(ok=>{if(ok)setTimeout(fin,450);else PL&&(PL.timer=setTimeout(fin,est))});setTimeout(fin,est*2.2+3000)});
}
function resetPl(){PL.token++;clearTimeout(PL.timer);hush();const el=PL.el;if(PL.svg)PL.svg.innerHTML='';el.querySelectorAll('#plh .hl').forEach(x=>x.classList.remove('hl'));el.querySelectorAll('#plh .mk').forEach(x=>x.remove());$('#plb',el).innerHTML='';el.querySelectorAll('#plpg b').forEach(b=>{b.style.transition='none';b.style.width='0'})}
async function runPl(){const P0=PL;while(PL===P0&&PL.playing&&PL.i<PL.A.length){const my=PL.token;await stepPl(PL.i);if(PL!==P0||my!==PL.token||!PL.playing)return;PL.i++}if(PL===P0&&PL.i>=PL.A.length){PL.playing=false;plIcon()}}
function jumpPl(n){resetPl();for(let k=0;k<n;k++){stepPl(k,true);$('#plpg',PL.el).children[k].firstChild.style.width='100%'}PL.i=n;const a=PL.A[n];$('#plst',PL.el).textContent=`${n+1}/${PL.A.length}`;$('#plcap',PL.el).textContent=a.soz;if(PL.playing)runPl()}
async function askPl(shown,istem){
  shown=String(shown||'').trim();if(!shown||!PL)return;const q=PL.q,el=PL.el;$('#plq',el).value='';pausePl();
  const chat=$('#plchat',el);const me=document.createElement('div');me.className='msg me';me.textContent=shown;chat.appendChild(me);
  const ai=document.createElement('div');ai.className='msg ai';ai.innerHTML='<small>Koç</small><span>Düşünüyor…</span>';chat.appendChild(ai);ai.scrollIntoView({behavior:'smooth',block:'nearest'});const out=ai.lastChild;
  const st=PL.A[Math.min(PL.i,PL.A.length-1)];
  const prompt=`Sen sabırlı bir TYT koçusun. Öğrenci bu sorunun adım adım anlatımını izliyor. ${qBilgi(q)}
Anlatım adımları: ${PL.A.map((a,n)=>(n+1)+') '+a.soz).join(' ')}
Öğrenci şu an ${Math.min(PL.i+1,PL.A.length)}. adımda: "${st.soz}".
${istem||'Öğrencinin sorusu: "'+shown+'"'}
Türkçe, düz metin, en fazla 4 kısa cümle. "Neden" sorularında kuralın mantığını açıkla. Markdown kullanma.`;
  try{const parts=await qParts(q);const t=await gemini([...parts,{text:prompt}]);out.textContent=t;say(t)}catch(e){out.textContent=gErr(e)}
}

/* ================= benzer soru ================= */
async function benzer(q){
  let close=sheet(`<h3>Benzer soru</h3><div class="bq" id="bq"><p class="lab" style="margin:0">Gemini yeni bir soru hazırlıyor…</p><div class="proc" style="min-height:60px"><span class="beam"></span></div></div>`,()=>{});
  const box=document.querySelector('#bq');
  try{
    const parts=await qParts(q);
    const y=await gemini([...parts,{text:`Bu bir TYT/AYT sorusu (${q.ders||''}${q.konu?', '+q.konu:''}). ${qBilgi(q)}
Aynı kazanımı ölçen, aynı mantıkla çözülen ama sayıları/durumu değişmiş YENİ bir çoktan seçmeli soru yaz. Soru metinden tam anlaşılmalı; şekil gerekiyorsa şekli kısa ve açık bir cümleyle tarif et. Tek doğru cevabı olsun, çeldiriciler mantıklı olsun.
Sadece JSON döndür: {"soru":"Türkçe soru metni","sekil":"şekil tarifi ya da null","secenekler":["5 şık metni, harfsiz"],"cevap":"A-E","cozum":"2-4 kısa cümle çözüm"}`}],true);
    const o=Array.isArray(y.secenekler)?y.secenekler.slice(0,5).map(s=>String(s)):[],ci=LET.indexOf(String(y.cevap||'').trim().toUpperCase()[0]);
    if(!y.soru||o.length<5||ci<0)throw{code:'err'};
    if(!box.isConnected)return;
    box.innerHTML=`<p class="stem"></p>${y.sekil?'<p class="sek"></p>':''}<div class="opts2">${o.map((t,i)=>`<button data-i="${i}"><b>${LET[i]})</b><span></span></button>`).join('')}</div><div id="bqr"></div>`;
    box.querySelector('.stem').textContent=y.soru;if(y.sekil)box.querySelector('.sek').textContent='Şekil: '+y.sekil;
    box.querySelectorAll('.opts2 button').forEach((b,i)=>{b.querySelector('span').textContent=o[i];b.onclick=()=>{if(box.dataset.done)return;box.dataset.done=1;const ok=i===ci;b.classList.add(ok?'ok':'bad');box.querySelectorAll('.opts2 button')[ci].classList.add('ok');if(ok){burst(b,40);addXP(6,b)}
      const r=$('#bqr');r.innerHTML=`<div class="fb ${ok?'ok':'bad'}" style="max-height:none"><h3>${ok?'Doğru!':'Cevap '+LET[ci]}</h3><p></p></div><div class="row" style="margin-top:10px"><button class="btn sm" id="bqAdd">Havuza ekle</button><button class="btn ghost sm" id="bqNew">Bir tane daha</button></div>`;r.querySelector('p').textContent=String(y.cozum||'');
      $('#bqAdd').onclick=e=>{const id='ek'+Date.now().toString(36);PR.ek=PR.ek||{};PR.ek[id]={id,tip:'html',html:`<div class="qhtml"><p>${esc(y.soru)}</p>${y.sekil?`<p><i>Şekil: ${esc(y.sekil)}</i></p>`:''}</div>`,o,ans:ci,mark:ci,ders:q.ders,konu:q.konu,cozum:String(y.cozum||'').slice(0,1500),solve:'done',kaynak:'Benzer soru',eklendi:new Date().toISOString(),t:now()};LS.set('sh2-ilerleme',PR);syncSoon();e.currentTarget.textContent='Eklendi ✓';e.currentTarget.disabled=true;toast('Benzer soru havuza eklendi.')};
      $('#bqNew').onclick=()=>{close();benzer(q)}}});
  }catch(e){if(box.isConnected)box.innerHTML=`<p class="diag"></p>`,box.firstChild.textContent=gErr(e)}
}

window.addEventListener('error',e=>console.warn(e.message));
home();
if(CFG.token){pull(true).then(()=>{if(view==='home')home();poll(DUR.calisiyor)})}
